<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs do Sistema - Magia Absoluta</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            color: white; 
            background-color: #1e3a5f;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .logs-container {
            background: rgba(15, 23, 42, 0.88);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
            width: 92%;
            max-width: 980px;
            height: 84vh;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .logs-header h2 {
            margin: 0;
            font-size: 18px;
            color: #4af37a;
            letter-spacing: 0.5px;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            background: #1e293b;
            color: #ffffff;
            outline: none;
        }

        input[type="text"]::placeholder { color: #94a3b8; }
        input[type="text"]:focus { border-color: #4af37a; }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        button:hover { filter: brightness(1.15); }

        .btn-atualizar { background: #4CAF50; color: white; }
        .btn-excluir-sel { background: #e67e22; color: #111; display: none; }
        .btn-esvaziar { background: #c0392b; color: white; }
        .btn-voltar { background: #475569; color: white; }

        .lista-cabecalho {
            display: grid;
            grid-template-columns: 35px 155px 95px 135px 1fr;
            gap: 10px;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 6px 6px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ff9800;
        }

        .logs-lista {
            flex: 1;
            overflow-y: auto;
            background: rgba(2, 6, 23, 0.55);
            border-radius: 0 0 8px 8px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logs-lista::-webkit-scrollbar { width: 8px; }
        .logs-lista::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 8px; }
        .logs-lista::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        .logs-lista::-webkit-scrollbar-thumb:hover { background: #4af37a; }

        .log-item {
            display: grid;
            grid-template-columns: 35px 155px 95px 135px 1fr;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .log-item:last-child { border-bottom: none; }
        .log-item:hover { background: rgba(255, 255, 255, 0.06); }

        .log-item.selecionado {
            background: rgba(56, 189, 248, 0.22) !important;
            border-left: 3px solid #38bdf8;
        }

        .chk-log {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ff9800;
        }

        .log-data { color: #94a3b8; font-size: 12px; }
        .log-usuario { color: #e2e8f0; font-weight: bold; }
        .log-desc { color: #cbd5e1; }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }
        .tipo-sucesso { background: rgba(74, 243, 122, 0.2); color: #4af37a; border: 1px solid rgba(74, 243, 122, 0.4); }
        .tipo-erro { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }

        footer { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            text-align: center; background-color: rgba(15, 23, 42, 0.9); 
            color: #94a3b8; padding: 8px 0; font-size: 0.8rem; z-index: 4; 
        }

        @media (max-width: 768px) {
            .logs-container { width: 95%; height: 88vh; padding: 15px; }
            .lista-cabecalho { display: none; }
            .log-item { grid-template-columns: 30px 1fr; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="logs-container">
        <div class="logs-header">
            <h2>🗑️ LIXEIRA / AUDITORIA DE LOGS DO SISTEMA</h2>
            <span id="contadorLogs" style="font-size: 12px; color: #94a3b8;">0 registro(s)</span>
        </div>

        <div class="controles">
            <input type="text" id="campoBusca" placeholder="Filtrar por usuário, ação ou detalhe..." onkeyup="filtrarLogs()">
            <button id="btnExcluirSelecionados" class="btn-excluir-sel" onclick="excluirSelecionados()">🗑️ Excluir Selecionados (0)</button>
            <button class="btn-atualizar" onclick="carregarLogs()">🔄 Atualizar</button>
            <button class="btn-esvaziar" onclick="esvaziarLixeira()">🧹 Esvaziar Lixeira</button>
            <button class="btn-voltar" onclick="window.location.href='/menu/menu.html'">Voltar</button>
        </div>

        <div class="lista-cabecalho">
            <div><input type="checkbox" id="chkSelecionarTodos" class="chk-log" title="Marcar/Desmarcar Todos" onclick="alternarTodos(this)"></div>
            <div>Data / Hora</div>
            <div>Status</div>
            <div>Usuário</div>
            <div>Ação / Detalhe</div>
        </div>

        <div class="logs-lista" id="listaLogs">
            <!-- Os logs serão inseridos aqui pelo appLog.js -->
        </div>
    </div>

    <footer>Sistema Material de Construção - Magia Absoluta</footer>

    <script src="appLog.js"></script>
</body>
</html>

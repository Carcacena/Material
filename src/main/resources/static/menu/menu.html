<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Menu - Material de Construção</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Arial, sans-serif;
			color: #ffffff;
			display: flex;
			justify-content: center;
			align-items: center;
			background:
				radial-gradient(circle at top left, rgba(76, 175, 80, 0.12), transparent 30%),
				radial-gradient(circle at bottom right, rgba(255, 152, 0, 0.10), transparent 25%),
				linear-gradient(135deg, #17202a, #273746, #1f3a2f);
			padding: 15px;
		}

		.box {
			width: 100%;
			max-width: 380px;
			background: rgba(0, 0, 0, 0.75);
			border-radius: 12px;
			padding: 16px 16px 14px;
			box-shadow:
				0 10px 25px rgba(0, 0, 0, 0.55),
				0 0 0 1px rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(6px);
			position: relative;
			overflow: hidden;
		}

		.box::before {
			content: "";
			position: absolute;
			top: 0;
			left: 14px;
			right: 14px;
			height: 3px;
			border-radius: 10px;
			background: linear-gradient(90deg, #4caf50, #ff9800, #03a9f4);
			box-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
		}

		.cabecalho {
			text-align: center;
			margin-bottom: 8px;
		}

		.cabecalho h2 {
			margin: 2px 0 2px;
			font-size: 16px;
			color: #4caf50;
			text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
		}

		.cabecalho .subtitulo {
			font-size: 10px;
			color: #b8c7d0;
			letter-spacing: 0.2px;
		}

		.bloco-titulo {
			font-size: 9px;
			text-transform: uppercase;
			letter-spacing: 0.8px;
			color: #ffb74d;
			text-align: left;
			margin: 8px 2px 4px;
			font-weight: bold;
		}

		.grid-buttons {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 6px;
		}

		button {
			width: 100%;
			border: none;
			border-radius: 6px;
			padding: 7px 6px;
			font-size: 12px;
			font-weight: bold;
			color: white;
			cursor: pointer;
			transition: all 0.22s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
			box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
		}

		button:hover {
			transform: translateY(-1px);
			filter: brightness(1.05);
			box-shadow: 0 5px 9px rgba(0, 0, 0, 0.3);
		}

		button:active {
			transform: translateY(0);
		}

		.full-width {
			grid-column: span 2;
		}

		.btn-pdv {
			background: linear-gradient(135deg, #2e7d32, #388e3c);
			border: 1px solid rgba(124, 255, 128, 0.2);
			font-size: 12.5px;
		}

		.btn-laranja {
			background: linear-gradient(135deg, #ff9800, #f57c00);
		}

		.btn-cinza {
			background: linear-gradient(135deg, #56606d, #4b5563);
		}

		.btn-azul {
			background: linear-gradient(135deg, #0288d1, #039be5);
		}

		.btn-verde-financeiro {
			background: linear-gradient(135deg, #198754, #157347);
		}

		.btn-roxo {
			background: linear-gradient(135deg, #6f42c1, #5e35b1);
		}

		.btn-gelo {
			background: linear-gradient(135deg, rgb(180, 185, 190), #4b5563);
			color: #ffffff;
		}

		.btn-sair {
			background: linear-gradient(135deg, #d63031, #c62828);
			margin-top: 2px;
		}

		.info {
			margin-top: 10px;
			padding-top: 8px;
			font-size: 10px;
			color: #9fb0ba;
			text-align: center;
			border-top: 1px solid rgba(255, 255, 255, 0.06);
		}

		.rodape-frase {
			margin-top: 2px;
			font-size: 9px;
			color: #7f8c8d;
			text-align: center;
		}

		@media (max-width: 520px) {
			.box {
				padding: 14px 12px 10px;
			}
		}
	</style>
</head>

<body>

	<div class="box">

		<div class="cabecalho">
			<h2>🌳 Material Construção</h2>
			<div class="subtitulo">Painel central do Sistema Magia</div>
		</div>

		<div class="bloco-titulo">Operação Principal</div>
		<div class="grid-buttons">
			<button class="btn-pdv full-width" onclick="irVendas()">⚡ Lançar Venda (PDV)</button>
		</div>

		<div class="bloco-titulo">Cadastros e Movimento</div>
		<div class="grid-buttons">
			<button class="btn-laranja" onclick="irProdutos()">📦 Produtos</button>
			<button class="btn-laranja" onclick="irEntradas()">📥 Entradas (NF)</button>
			<button class="btn-cinza" onclick="irClientes()">👥 Clientes</button>
			<button class="btn-cinza" onclick="irFornecedores()">🚚 Fornecedores</button>
		</div>

		<div class="bloco-titulo">Financeiro</div>
		<div class="grid-buttons">
			<button class="btn-verde-financeiro" onclick="irContasReceber()">💰 Contas a Receber</button>
			<button class="btn-roxo" onclick="irContasPagar()">🧾 Contas a Pagar</button>
			<button class="btn-gelo full-width" onclick="irEscrituracao()">🧾 Escrituração Fiscal</button>
		</div>

		<div class="bloco-titulo">Gerencial</div>
		<div class="grid-buttons">
			<button class="btn-azul full-width" onclick="irRelatorios()">📊 Relatórios Gerenciais (PDF)</button>
			<button class="btn-cinza full-width" onclick="irOrigemSistema()">🛠️ Origem do Sistema</button>
			<button class="btn-cinza full-width" onclick="irUsuario()">👤 Cadastro Usuário</button>
			<button class="btn-sair full-width" onclick="sair()">❌ Sair do Sistema</button>
		</div>

		<div class="info">Usuário autenticado via JWT 🔑</div>
		<div class="rodape-frase">Problemas existem para ser explicados.</div>

	</div>

	<script>
		// 🔑 PROTEÇÃO DE ACESSO
		const token = localStorage.getItem("token");
		if (!token) {
			window.location.href = "/login.html";
		}

		// 🚀 NAVEGAÇÃO
		function irUsuario(){
			window.location.href = "/menu/crudUsuario.html";
		}

		function irVendas() {
			window.location.href = "/vendas/vendas.html";
		}

		// ... Restante das suas funções de navegação mantidas intactas ...
		function irFornecedores() { window.location.href = "/Fornecedores/crudFornecedor.html"; }
		public_profile = false; // Controle de escopo local
		function irProdutos() { window.location.href = "/Produtos/crudProduto.html"; }
		function irClientes() { window.location.href = "/Clientes/crudCliente.html"; }
		function irEntradas() { window.location.href = "/Entradas/entradaProduto.html"; }
		function irOrigemSistema() { window.location.href = "/OrigemSistema/crudOrigemSistema.html"; }
		function irRelatorios() { window.location.href = "/relatorios/painelRelatorios.html"; }

		// 💰 FINANCEIRO
		function irContasReceber() { window.location.href = "/vendas/Financeiro/contasReceber/contasReceber.html"; }
		function irContasPagar() { window.location.href = "/Entradas/Financeiro/contasPagar/contasPagar.html"; }
		function irEscrituracao() { window.location.href = "/relatorios/escrituracao.html"; }

		// 🚪 LOGOUT
		function sair() {
			localStorage.removeItem("token");
			window.location.href = "/login.html";
		}
	</script>

</body>
</html>

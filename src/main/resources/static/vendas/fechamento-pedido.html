<!-- ⚙️ BOTÃO FIXO NA TELA (Sempre disponível e chamando a função direto) -->
<button id="btnAbrirPainelCaixa" type="button" onclick="togglePainelDoCaixaDirect()"
	style="position: fixed; top: 90px; right: 25px; z-index: 1999; background: #ff9800; color: #111; border: none; border-radius: 6px; padding: 8px 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
	⚙️ AÇÕES
</button>

<!-- 🛠️ MENU CRUD VERTICAL FLUTUANTE -->
<div id="painelCaixa" class="painel-flutuante"
	style="display: none; position: fixed; top: 140px; right: 25px; z-index: 1998; background: #2c3e50; border: 2px solid #ff9800; border-radius: 8px; padding: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">

	<!-- TOPO DO CRUD COM O BOTÃO X -->
	<div id="painelCaixaHeader" class="painel-header"
		style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255, 152, 0, 0.4); padding-bottom: 8px; margin-bottom: 10px;">
		<span style="color: #ff9800; font-weight: bold; font-family: monospace;">::: CRUD CAIXA :::</span>
		<!-- Botão X Vermelho que também executa a mesma função direta -->
		<button type="button" onclick="document.getElementById('painelCaixa').style.display='none'"
			style="background: #e74c3c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; padding: 4px 9px; line-height: 1;">
		</button>
	</div>

	<div class="painel-corpo" style="display: flex; flex-direction: column; gap: 8px;">

		<button class="btn-menu-vertical btn-incluir" onclick="deixarPedidoPendente()">Orçamento (F2)</button>

		<button class="btn-menu-vertical btn-fechar" onclick="abrirPainelFechamento()">Fechar Pedido (F10)</button>

		<button class="btn-menu-vertical btn-excluir" onclick="limparTelaCupom()">Limpar Cupom</button>

		<button class="btn-menu-vertical btn-carrinho" onclick="pesquisaCarrinho()">Pesquisa Carrinho</button>


		<button type="button" class="btn btn-success fw-bold" onclick="confirmarFaturamentoDefinitivo()"
			style="padding: 10px 20px;">
			CONFIRMAR FATURAMENTO (F10)
		</button>

		<button class="btn-menu-vertical btn-voltar" onclick="window.location.href='/menu/menu.html'">
			<u>V</u>oltar
		</button>

	</div>
</div>

<!-- 📦 SCRIPT GLOBAL INJETADO DIRETO NA MESA DE NEGOCIAÇÃO -->
<script>
	// Força a função a existir na raiz global (window), impedindo erros de "not defined"
	window.togglePainelDoCaixaDirect = function () {
		const painel = document.getElementById("painelCaixa");
		if (!painel) return;

		// Pega o estilo real e alterna sem frescura
		if (painel.style.display === "none") {
			painel.style.setProperty("display", "block", "important");
		} else {
			painel.style.setProperty("display", "none", "important");
		}
	};
</script>

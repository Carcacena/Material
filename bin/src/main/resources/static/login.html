<style>

/* 🔐 LOGIN */
.login-box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

button{

    background:#4CAF50;

    font-weight:bold;
    cursor:pointer;

/* 🔦 SPOTLIGHT */
.spotlight{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* 🧠 SLIDESHOW */
.foto-frame{
    position: fixed;
    top: 15px;
    left: 15px;
    width: 260px;
    height: 260px;
    z-index: 2;
}

.foto-frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    transition: opacity 0.6s ease;
}

#legenda{
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 6px;
    font-size: 13px;
    text-align: center;
    background: rgba(0,0,0,0.6);
    border-radius: 0 0 12px 12px;
}

/* 📱 MOBILE */
@media (max-width: 768px){
    .foto-frame{
        width: 160px;
        height: 160px;
        top: 10px;
        left: 10px;
    }

    body::after{
        content:"";
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background: rgba(0,0,0,0.35);
        pointer-events:none;
    }
}

        <!-- AJUSTE 1: Adicionado type="button" para não submeter o formulário de login ao clicar em Sair -->

    </form>

<script>

/* 🔦 SPOTLIGHT */
const spotlight = document.querySelector(".spotlight");

const isMobile = window.matchMedia("(max-width: 768px)").matches ||
                 /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const raio = isMobile ? 420 : 260;
const escuro = isMobile ? 0.28 : 0.70;

function atualizarSpot(x, y){
    spotlight.style.background = `
        radial-gradient(
            circle ${raio}px at ${x}px ${y}px,
            rgba(0,0,0,0) 0px,
            rgba(0,0,0,0.10) 180px,
            rgba(0,0,0,${escuro}) 360px,
            rgba(0,0,0,0.95) 100%
        )
    `;
}

document.addEventListener("mousemove", e => {
    atualizarSpot(e.clientX, e.clientY);
});

document.addEventListener("touchmove", e => {
    const t = e.touches[0];
    atualizarSpot(t.clientX, t.clientY);
});

/* 🎬 SLIDESHOW */


let i = 0;

/* 🎻 áudio */

/* 📦 login drag */
const box = document.getElementById("loginBox");

let offsetX = 0;
let offsetY = 0;
let isDown = false;

box.addEventListener("mousedown", (e)=>{
    isDown = true;
    offsetX = e.clientX - box.offsetLeft;
    offsetY = e.clientY - box.offsetTop;
    box.style.transform = "none";
});

document.addEventListener("mouseup", ()=>{
    isDown = false;
});

document.addEventListener("mousemove", (e)=>{
    if(!isDown) return;
    box.style.left = (e.clientX - offsetX) + "px";
    box.style.top = (e.clientY - offsetY) + "px";
});

// AJUSTE 2: Rota corrigida para /auth/logout enviando o token no Header do padrão Bearer exigido pelo seu filtro Java
function logout() {
    const token = localStorage.getItem("token");
    fetch("https://railway.app", { 
        method: "POST",
        headers: {
            "Authorization": token ? (token.startsWith("Bearer ") ? token : "Bearer " + token) : ""
        }
    })
    .finally(() => {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    });
}

</script>
